<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101114"><title>Board Tasks · FWRD</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#f6f6f6;background:#0c0d0f}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button,input,select,textarea{border-radius:12px;border:1px solid #44464b;background:#1b1d20;color:#fff;padding:13px}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid white;outline-offset:2px}button.primary{background:#f7f7f7;color:#111;border-color:#f7f7f;font-weight:750}button:disabled{opacity:.45;cursor:not-allowed}.wrap{max-width:850px;margin:auto;padding:24px 18px 90px}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #303135;padding-bottom:18px}.logo{font-size:28px;font-weight:900;letter-spacing:-1.8px}.back{color:#aaa;text-decoration:none;font-size:13px}.eyebrow{font-size:11px;letter-spacing:1.7px;text-transform:uppercase;color:#aaa;font-weight:700}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:30px 0 20px}h1{font-size:clamp(29px,6vw,42px);letter-spacing:-1.5px;margin:6px 0}h2{font-size:24px;letter-spacing:-.7px}p{color:#b6b7b9}.filters{display:flex;gap:7px;margin-bottom:18px;overflow-x:auto}.filters button{white-space:nowrap;flex:1;min-width:0;padding:12px 8px;font-size:13px}.filters button.active{background:#f6f6f6;color:#111;border-color:#f6f6f6}.task{width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px;margin:10px 0;border-radius:15px;background:#191a1d}.task strong{display:block;font-size:16px;line-height:1.4}.task small{display:block;color:#aaa;margin-top:7px;font-size:12px}.task.done strong{text-decoration:line-through;color:#a5a5a5}.arrow{font-size:23px;color:#aaa}.panel{border:1px solid #383a3e;border-radius:20px;padding:20px;margin-top:20px}.muted{color:#aaa;font-size:13px}.field{display:grid;gap:8px;margin:16px 0}label{font-weight:650;font-size:14px}input,textarea,select{width:100%;min-width:0}textarea{resize:vertical;line-height:1.5}.actions{display:flex;gap:10px;margin-top:22px}.actions button{flex:1}.details{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.chip{border:1px solid #444;border-radius:30px;padding:9px 12px;color:#ccc;font-size:12px}.message{background:#1c1d20;padding:14px;border-radius:13px;margin:12px 0}.message strong{font-size:12px}.message p{color:#eee;margin:7px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.empty{padding:35px 16px;color:#aaa;text-align:center;border:1px dashed #454545;border-radius:15px}.notice{font-size:12px;color:#a7a7a7;margin-top:25px;line-height:1.5}.hidden{display:none!important}@media(max-width:540px){.wrap{padding:18px 15px 80px}.heading{margin-top:25px}.heading button{padding:12px}.panel{padding:16px}.filters button{font-size:12px}.actions{flex-direction:column}.actions button{width:100%}} body.embedded .top{display:none}body.embedded .wrap{padding:4px 0 30px}body.embedded .heading{margin:4px 0 16px}body.embedded h1{font-size:26px;letter-spacing:-.6px}body.embedded .eyebrow{font-size:10px;letter-spacing:.7px}body.embedded .heading button{font-size:13px;padding:10px 12px;white-space:nowrap}body.embedded .notice{font-size:11px}body.embedded .filters button{font-size:12px;padding:10px 5px}body.embedded .panel{margin-top:8px}@media(max-width:540px){body.embedded .heading{align-items:center}body.embedded .heading button{max-width:125px}body.embedded .filters{gap:5px}}</style></head><body><main class="wrap"><header class="top"><div class="logo">FWRD→</div><a class="back" href="./index.html">← Client portal</a></header><div class="heading"><div><div class="eyebrow">Bridge Kids International / Board</div><h1 id="heading">Tasks</h1></div><button class="primary" id="new">+ New Task</button></div>
<section id="listview"><nav class="filters" aria-label="Task filter"><button data-filter="mine" class="active">Mine</button><button data-filter="committee">Committee</button><button data-filter="board">Board</button><button data-filter="completed">Completed</button></nav><div id="tasks"></div></section>
<section id="formview" class="panel hidden"><h2>New Task</h2><form id="form"><div class="field"><label for="taskname">What needs to be done?</label><textarea id="taskname" rows="2" maxlength="180" placeholder="e.g. Build website advertisements" required></textarea></div><div class="field"><label for="person">Assign to</label><select id="person" required><option value="">Choose a board member</option><option value="Me">Me</option><option value="Member A">Member A (example)</option><option value="Member B">Member B (example)</option></select></div><div class="field"><label for="scope">Where does it belong?</label><select id="scope"><option value="board">Board</option><option value="committee">Committee</option></select></div><div class="field hidden" id="committee-field"><label for="committee">Committee</label><input id="committee" placeholder="Enter committee name" maxlength="80"></div><div class="field"><label for="due">Due date (optional)</label><input id="due" type="date"></div><div class="actions"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Assign Task</button></div></form></section>
<section id="detailview" class="panel hidden"><button id="back" type="button">← All tasks</button><div class="eyebrow" style="margin-top:22px">TASK DETAILS</div><h2 id="detail-title"></h2><div class="details" id="detail-meta"></div><h3>Conversation</h3><div id="conversation"></div><form id="replyform"><div class="field"><label for="reply">Reply or share an update</label><textarea id="reply" rows="3" maxlength="3000" required placeholder="Write a reply…"></textarea></div><button type="submit">Send reply</button></form><div class="actions"><button id="complete" class="primary" type="button">Mark Complete</button></div></section><div class="notice">Prototype · Sample members only. Tasks and replies are saved in this browser, not shared with real board members. No login, email access, or server permissions are active.</div></main>
<script>(()=>{'use strict';if(new URLSearchParams(location.search).get('embedded')==='1')document.body.classList.add('embedded');const key='fwrd-board-tasks-demo-v1',el=id=>document.getElementById(id),escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));let tasks=[];try{const saved=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(saved))tasks=saved}catch{}let filter='mine',selected=null;const persist=()=>localStorage.setItem(key,JSON.stringify(tasks));function show(view){for(const id of ['listview','formview','detailview'])el(id).classList.toggle('hidden',id!==view);el('heading').textContent=view==='formview'?'New Task':view==='detailview'?'Task':'Tasks';el('new').classList.toggle('hidden',view!=='listview')}function render(){document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===filter));const visible=tasks.filter(t=>filter==='completed'?t.done:!t.done&&(filter==='mine'?t.person==='Me':filter==='committee'?t.scope==='committee':t.scope==='board'));el('tasks').innerHTML=visible.length?visible.map(t=>'<button class="task '+(t.done?'done':'')+'" data-id="'+escape(t.id)+'"><span><strong>'+escape(t.name)+'</strong><small>'+escape(t.person)+' · '+(t.scope==='committee'?escape(t.committee||'Committee'):'Board')+(t.due?' · '+escape(t.due):'')+'</small></span><span class="arrow">›</span></button>').join(''):'<div class="empty">No tasks here yet.</div>';el('tasks').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openTask(b.dataset.id))}function openTask(id){selected=id;const t=tasks.find(x=>x.id===id);if(!t)return;el('detail-title').textContent=t.name;el('detail-meta').innerHTML='<span class="chip">👤 '+escape(t.person)+'</span><span class="chip">📅 '+escape(t.due||'No due date')+'</span><span class="chip">'+escape(t.scope==='committee'?(t.committee||'Committee'):'Board')+'</span><span class="chip">'+(t.done?'Completed':'To do')+'</span>';el('conversation').innerHTML=t.messages.length?t.messages.map(m=>'<div class="message"><strong>'+escape(m.author)+'</strong><p>'+escape(m.text)+'</p></div>').join(''):'<div class="empty">No replies yet. Start the conversation.</div>';el('complete').textContent=t.done?'Reopen Task':'Mark Complete';show('detailview')}el('new').onclick=()=>{el('form').reset();el('committee-field').classList.add('hidden');show('formview')};el('cancel').onclick=()=>show('listview');el('back').onclick=()=>{render();show('listview')};el('scope').onchange=()=>el('committee-field').classList.toggle('hidden',el('scope').value!=='committee');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render()});el('form').onsubmit=e=>{e.preventDefault();const name=el('taskname').value.trim(),person=el('person').value,scope=el('scope').value,committee=el('committee').value.trim();if(!name||!person){return}if(scope==='committee'&&!committee){el('committee').focus();return}const id=String(Date.now())+'-'+Math.random().toString(36).slice(2);tasks.unshift({id,name,person,scope,committee:scope==='committee'?committee:'',due:el('due').value,done:false,messages:[]});persist();filter=person==='Me'?'mine':scope;render();openTask(id)};el('replyform').onsubmit=e=>{e.preventDefault();const t=tasks.find(x=>x.id===selected),msg=el('reply').value.trim();if(!t||!msg)return;t.messages.push({author:'You (demo)',text:msg});persist();el('reply').value='';openTask(selected)};el('complete').onclick=()=>{const t=tasks.find(x=>x.id===selected);if(!t)return;t.done=!t.done;persist();openTask(selected)};render()})();</script></body></html>
