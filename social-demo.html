<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FWRD Social | Workspace</title><style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f7f5;color:#171717}*{box-sizing:border-box}body{margin:0}.wrap{max-width:900px;margin:auto;padding:20px 16px 70px}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #ddd;border-radius:10px;background:#fff;padding:10px 14px;color:#171717}button.active,button.primary{background:#171717;color:white;border-color:#171717}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #555;outline-offset:2px}.top,.between{display:flex;justify-content:space-between;align-items:center;gap:12px}.top{border-bottom:1px solid #ddd;padding-bottom:18px}.brand{font-weight:900;font-size:24px;letter-spacing:-1px}.muted{color:#777;font-size:12px}.label{font-size:11px;color:#777;font-weight:700;letter-spacing:1px}.head{margin:25px 0 20px}h1{font-size:30px;letter-spacing:-1px;margin:4px 0}h2{font-size:19px;margin:0 0 14px}.tabs{display:flex;gap:7px;margin:18px 0;overflow:auto}.tabs button{white-space:nowrap}.panel{border:1px solid #e4e4e4;background:white;border-radius:15px;padding:18px;margin:13px 0}.platforms{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.platform{padding:14px;border:1px solid #e6e6e6;border-radius:12px}.platform b{display:block;margin-bottom:8px}.platform-link{display:block;color:inherit;text-decoration:none}.platform-link:hover,.platform-link:focus-visible{border-color:#888;background:#fafafa}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{padding:16px;background:#f5f5f4;border-radius:12px}.stat strong{font-size:24px;display:block;margin-top:8px}.field{display:block;font-size:12px;font-weight:700;margin:16px 0 6px}.control{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;background:white;color:#171717}textarea{resize:vertical}.choices{display:flex;flex-wrap:wrap;gap:8px}.choices label{border:1px solid #ddd;border-radius:9px;padding:10px 12px;font-size:13px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.entry{padding:13px 0;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;gap:12px}.entry:last-child{border:0}.entry b{font-size:14px}.entry p{font-size:12px;color:#777;margin:5px 0}.chip{font-size:11px;border:1px solid #ddd;border-radius:30px;padding:5px 9px;white-space:nowrap}.empty{color:#777;padding:20px 0;font-size:14px}.notice{color:#777;font-size:12px;line-height:1.5;margin-top:20px} .connect-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.connect-row h2{margin:0}.setup-details{margin-top:14px;border-top:1px solid #eee;padding-top:12px}.setup-details p{font-size:13px;line-height:1.6;color:#555}.setup-details a{font-weight:700;text-decoration:underline}.setup-details ol{font-size:13px;line-height:1.7;padding-left:20px}.content-head{margin-bottom:14px}.content-head h2{margin:0}.content-head button{font-size:12px;padding:8px 10px;white-space:nowrap;flex-shrink:0}@media(max-width:560px){.wrap{padding:15px 12px 60px}.platform{padding:11px}.platform b{font-size:12px}.top select{max-width:150px}.panel{padding:14px}.head h1{font-size:27px}}
</style></head><body><main class="wrap"><header class="top"><div><a class="muted" href="./index.html?v=20261105-9">← FWRD dashboard</a><div class="brand">FWRD →</div><div class="label">SOCIAL / WORKSPACE</div></div><select id="org" class="control" style="width:auto" aria-label="Organization"><option value="ourplace">Our Place</option><option value="bridge">Bridge Kids</option><option value="kazazi">Kazazi</option></select></header>
<div class="head between"><div><div class="label" id="orgname">BRIDGE KIDS INTERNATIONAL</div><h1>Social</h1></div><button class="primary" id="create">+ Create</button></div><nav class="tabs"><button data-tab="overview" class="active">Overview</button><button data-tab="calendar">Calendar</button><button data-tab="create">Create</button></nav><section id="content"></section><p class="notice">LOCAL WORKSPACE · Drafts and manual metrics are saved only in this browser. No automatic publishing or analytics. Export important work regularly; clearing browser data may erase it.</p></main><script>
const $=s=>document.querySelector(s),escape=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let org=(new URLSearchParams(location.search).get("org")||"ourplace"),tab="overview";if(!["bridge","kazazi","ourplace"].includes(org))org="ourplace";const names={bridge:"BRIDGE KIDS INTERNATIONAL",kazazi:"KAZAZI",ourplace:"OUR PLACE @ BEN WASHER PARK"};let posts={bridge:[],kazazi:[],ourplace:[]};try{posts=Object.assign(posts,JSON.parse(localStorage.getItem("fwrd-social-preview-v1")||"{}"))}catch(e){}function save(){localStorage.setItem("fwrd-social-preview-v1",JSON.stringify(posts))}
let metrics={};try{metrics=JSON.parse(localStorage.getItem("fwrd-social-metrics-v1")||"{}")}catch(e){}function saveMetrics(){localStorage.setItem("fwrd-social-metrics-v1",JSON.stringify(metrics))}function render(){document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));$("#orgname").textContent=names[org];$("#create").style.display=tab==="create"?"none":"";if(tab==="overview"){overview();$("#metricsform").onsubmit=e=>{e.preventDefault();const d=new FormData(e.target);metrics[org]={reach:String(d.get("reach")||""),engagement:String(d.get("engagement")||""),followers:String(d.get("followers")||""),notes:String(d.get("notes")||""),updated:new Date().toLocaleDateString()};saveMetrics();render()}}else if(tab==="calendar")calendar();else create()}
function overview(){const m=metrics[org]||{};$("#content").innerHTML='<div class="panel"><div class="between"><div><div class="label">SOCIAL SHORTCUTS</div><h2 style="margin:5px 0">Social workspace</h2><span class="muted">'+escape(names[org])+' · App shortcuts</span></div><a class="chip" href="https://www.instagram.com/" target="_blank" rel="noopener noreferrer">Open Instagram ↗</a></div><p class="notice">Tap a channel below to open its app or website. Sign in with the client account there.</p></div><div class="panel"><h2>Channels</h2><div class="platforms">'+["Facebook","Instagram","TikTok"].map(p=>'<a class="platform platform-link" href="'+({Facebook:"https://www.facebook.com/",Instagram:"https://www.instagram.com/",TikTok:"https://www.tiktok.com/"}[p])+'" target="_blank" rel="noopener noreferrer"><b>'+p+' ↗</b><span class="muted">Open app</span></a>').join("")+'</div></div><div class="panel"><div class="between"><h2>Manual performance</h2><span class="muted">'+escape(m.updated?"Updated "+m.updated:"Not entered")+'</span></div><div class="stats">'+[["Reach / views",m.reach],["Engagement",m.engagement],["Followers",m.followers]].map(x=>'<div class="stat"><span class="muted">'+x[0]+'</span><strong>'+escape(x[1]||"—")+'</strong></div>').join("")+'</div><form id="metricsform"><label class="field">Reach / views</label><input class="control" name="reach" inputmode="numeric" placeholder="e.g. 1250" value="'+escape(m.reach||"")+'"><label class="field">Engagement</label><input class="control" name="engagement" inputmode="numeric" placeholder="e.g. 84" value="'+escape(m.engagement||"")+'"><label class="field">Followers</label><input class="control" name="followers" inputmode="numeric" placeholder="e.g. 420" value="'+escape(m.followers||"")+'"><label class="field">Notes / top content</label><textarea class="control" name="notes" rows="2" placeholder="What worked?">'+escape(m.notes||"")+'</textarea><div class="actions"><button type="submit" class="primary">Save metrics</button></div></form></div><div class="panel"><div class="between content-head"><h2>Content</h2><button onclick="tab=\'calendar\';render()">Calendar →</button></div><div class="stats"><div class="stat"><span class="muted">Drafts</span><strong>'+posts[org].filter(p=>p.status==="Draft").length+'</strong></div><div class="stat"><span class="muted">Planned</span><strong>'+posts[org].filter(p=>p.status==="Planned").length+'</strong></div></div><div class="actions"><button id="exportdata">Export workspace JSON</button></div></div>';$("#exportdata").onclick=()=>{const blob=new Blob([JSON.stringify({organization:org,posts:posts[org],metrics:metrics[org]||{}},null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const link=document.createElement("a");link.href=url;link.download="fwrd-"+org+"-workspace.json";link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}}
function calendar(){let arr=[...posts[org]].sort((a,b)=>(a.date||"9999").localeCompare(b.date||"9999"));$("#content").innerHTML='<div class="panel"><div class="between"><h2>Content calendar</h2><button onclick="tab=\'create\';render()">+ New</button></div>'+(arr.length?arr.map(p=>'<div class="entry"><div><b>'+escape(p.title||p.caption.slice(0,45))+'</b><p>'+escape(p.platforms.join(" · "))+' · '+escape(p.date||"No date")+'</p></div><div class="actions"><span class="chip">'+escape(p.status)+'</span><button type="button" data-copy="'+posts[org].indexOf(p)+'">Copy caption</button><button type="button" data-delete="'+posts[org].indexOf(p)+'">Delete</button></div></div>').join(""):'<div class="empty">No content planned yet. Create a draft to get started.</div>')+'</div>'}
function create(){$("#content").innerHTML='<div class="panel"><h2>Create content</h2><form id="postform"><label class="field">Post title (internal)</label><input class="control" name="title" placeholder="e.g. Event recap" maxlength="100"><label class="field">Caption</label><textarea class="control" name="caption" rows="5" required placeholder="Write your caption…"></textarea><label class="field">Platforms</label><div class="choices"><label><input type="checkbox" name="platform" value="Facebook"> Facebook</label><label><input type="checkbox" name="platform" value="Instagram" checked> Instagram</label><label><input type="checkbox" name="platform" value="TikTok"> TikTok</label></div><label class="field">Media</label><input type="file" class="control" id="media" accept="image/*,video/*"><p class="muted">Media stays on your device. Select it again when posting in Instagram.</p><label class="field">Planned date (optional)</label><input class="control" type="date" name="date"><div class="actions"><button class="primary" type="submit" name="intent" value="Draft">Save Draft</button><button type="submit" name="intent" value="Planned">Add to Calendar</button><button type="button" disabled title="Requires secure account connection">Publish · Coming later</button></div></form></div>';$("form").onsubmit=e=>{e.preventDefault();let d=new FormData(e.target),platforms=d.getAll("platform");if(!platforms.length){alert("Choose at least one platform");return}let intent=e.submitter?.value||"Draft";posts[org].push({title:String(d.get("title")).trim(),caption:String(d.get("caption")).trim(),platforms,date:String(d.get("date")),status:intent});save();tab="calendar";render()}}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$("#org").value=org;$("#org").onchange=e=>{org=e.target.value;render()};$("#create").onclick=()=>{tab="create";render()};render();
</script></body></html>
