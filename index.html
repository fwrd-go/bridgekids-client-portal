<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101114"><title>Client Portal | FWRD</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#f7f7f7;background:#0c0d0f;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid white;outline-offset:3px}button{border:1px solid #45464a;background:#1d1e22;color:white;border-radius:10px;padding:11px 14px}button:hover{background:#303136}button.active{background:#f4f4f4;color:#111;border-color:#f4f4f4}.wrap{max-width:1160px;margin:auto;padding:24px 22px 80px}.top{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #333;padding-bottom:20px}.brand{font-size:31px;font-weight:900;letter-spacing:-2px}.brand span{font-size:29px;margin-left:2px}.eyebrow{font-size:10px;color:#aaa;letter-spacing:2px;font-weight:700}.muted{color:#a7a8ab}.pill{border:1px solid #555;border-radius:50px;padding:7px 11px;font-size:11px;color:#bbb}.intro{margin:42px 0 26px}.intro h1{font-size:clamp(30px,5vw,52px);letter-spacing:-2px;margin:5px 0}.intro p{color:#aaa;margin:0}.map{display:grid;grid-template-columns:1fr 210px 1fr;gap:20px;align-items:center;max-width:960px;margin:30px auto 44px}.org{min-height:150px;text-align:left;background:#1a1b1e;border:1px solid #414247;border-radius:16px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;transition:.2s}.org:hover,.org.selected{border-color:#fff;background:#242529}.org strong{font-size:23px;letter-spacing:-.7px}.org small{font-size:11px;color:#aaa}.hub{height:190px;width:190px;border-radius:100%;border:2px solid #e9e9e9;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:auto;background:#111;box-shadow:0 0 0 9px #1d1e20}.hub strong{font-size:34px;letter-spacing:-2px}.hub span{font-size:10px;letter-spacing:2px;color:#aaa}.org.third{grid-column:2;min-height:130px}.line{height:1px;background:#4b4b4b}.panel{border:1px solid #38393c;background:#151619;border-radius:18px;padding:25px}.panelhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.panel h2{font-size:27px;margin:4px 0 0;letter-spacing:-1px}.tabs{display:flex;flex-wrap:wrap;gap:9px;border-bottom:1px solid #333;padding:22px 0;margin-bottom:22px}.tabs button{font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:26px}.stat{background:#222326;padding:20px;border-radius:12px}.stat b{font-size:30px;display:block;margin-top:8px}.stat small{color:#aaa}.services{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.service{border:1px solid #393a3d;border-radius:12px;padding:17px;background:#1c1d20}.service strong{display:block;margin-bottom:8px}.service small{color:#999}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.form{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}input,textarea{border:1px solid #505156;background:#202125;border-radius:9px;color:white;padding:12px;width:100%}.form input{flex:1;min-width:180px}.item{display:flex;gap:12px;align-items:center;justify-content:space-between;border-bottom:1px solid #343538;padding:14px 0}.item label{flex:1;overflow-wrap:anywhere}.item.done label{text-decoration:line-through;color:#888}.item button{padding:7px 10px}.note{border:1px solid #393a3d;border-radius:10px;padding:16px;margin:10px 0;background:#202125;white-space:pre-wrap;overflow-wrap:anywhere}.note small{color:#aaa}.empty{color:#999;padding:15px 0}.notice{border-left:2px solid #777;padding:12px 16px;background:#202125;color:#b8b8b8;font-size:13px;margin:20px 0}.footer{margin-top:28px;color:#888;font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}@media(max-width:800px){.map{grid-template-columns:1fr 1fr;gap:12px}.hub{grid-column:1/-1;grid-row:2;width:140px;height:140px}.org.third{grid-column:1/-1;grid-row:3;max-width:340px;width:100%;justify-self:center}.org{min-height:130px;padding:15px}.org strong{font-size:18px}.map .org:nth-child(2){grid-column:2;grid-row:1}.stats{grid-template-columns:1fr 1fr}}@media(max-width:480px){.wrap{padding:17px 14px 60px}.top .pill{display:none}.intro{margin:28px 0}.map{margin:20px auto 30px}.panel{padding:16px}.services{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.stat{padding:13px}.stat b{font-size:24px}.panelhead{flex-direction:column}.org strong{font-size:16px}}
@media(max-width:600px){.intro h1{font-size:30px}.panel h2{font-size:23px}.tabs{gap:7px}.tabs button{padding:10px 12px}.eyebrow{letter-spacing:1px}.map{gap:10px}.org{min-width:0}.org strong{overflow-wrap:break-word}} iframe{display:block}</style></head><body><main class="wrap"><header class="top"><div><div class="brand">FWRD<span>→</span></div><div class="eyebrow">CLIENT PORTAL</div></div><div class="pill">WORKSPACES</div></header>
<section class="intro"><div class="eyebrow">FWRD / CLIENT PORTAL</div><h1>Choose a workspace</h1><p>Bridge Kids · Kazazi · Our Place</p></section>
<section class="map" aria-label="Select a workspace"><button class="org" data-org="bridge"><small>WORKSPACE 01</small><strong>Bridge Kids</strong><small>INTERNATIONAL</small></button><button class="org" data-org="kazazi"><small>WORKSPACE 02</small><strong>Kazazi</strong><small>CLIENT WORKSPACE</small></button><div class="hub" aria-label="FWRD admin hub"><strong>FWRD→</strong><span>ADMIN HUB</span></div><button class="org third" data-org="ourplace"><small>WORKSPACE 03</small><strong>Our Place</strong><small>@ BEN WASHER PARK</small></button></section>
<section class="panel" id="workspace" aria-live="polite" style="display:none"><div class="panelhead"><div><div class="eyebrow" id="workspace-number">WORKSPACE 02</div><h2 id="workspace-title">Kazazi</h2></div><div class="pill">MANAGED BY FWRD →</div></div><nav class="tabs" aria-label="Workspace sections"><button class="active" data-tab="overview">Overview</button><button data-tab="tasks">Tasks</button><button data-tab="notes">Notes</button><button data-tab="settings">Settings</button></nav><div id="content"></div></section><section style="margin:25px 0 10px;border:1px solid #38393c;border-radius:16px;padding:20px;background:#151619"><div class="eyebrow">FWRD / MANAGEMENT</div><div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:10px"><div><strong style="font-size:20px">Social</strong><p class="muted" style="font-size:13px;margin:6px 0 0">Facebook · Instagram · TikTok</p></div><a href="./social-demo.html?v=20261105-9" style="display:inline-block;background:#f4f4f4;color:#111;text-decoration:none;border-radius:9px;padding:12px 16px;font-weight:700;font-size:13px">Open Social →</a></div></section><footer class="footer"><span>© FWRD · Moving ideas FWRD →</span><span>FWRD · Web · Media · GIS</span></footer></main>
<script>
(()=>{'use strict';
const orgs={bridge:{name:'Bridge Kids',subtitle:'International',num:'01'},kazazi:{name:'Kazazi',subtitle:'',num:'02'},ourplace:{name:'Our Place',subtitle:'@ Ben Washer Park',num:'03'}};
const services=['Email / Google Workspace','Website / DNS','Mailchimp','Facebook','Instagram'];
const key='fwrd-bridgekids-portal-v1';
let state={bridge:{tasks:[],notes:[],settings:{}},kazazi:{tasks:[],notes:[],settings:{}},ourplace:{tasks:[],notes:[],settings:{}}};
try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(saved&&typeof saved==='object')for(const k of Object.keys(orgs)){if(saved[k]){state[k].tasks=Array.isArray(saved[k].tasks)?saved[k].tasks:[];state[k].notes=Array.isArray(saved[k].notes)?saved[k].notes:[];state[k].settings=saved[k].settings&&typeof saved[k].settings==='object'?saved[k].settings:{}}}}catch(e){console.warn('Unable to read local data',e)}
let org=null,tab='overview';const $=s=>document.querySelector(s),content=$('#content');const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(key,JSON.stringify(state))}catch(e){alert('Local storage unavailable. Changes may not persist.')}};
function render(){if(!org){$('#workspace').style.display='none';document.querySelectorAll('[data-org]').forEach(b=>b.classList.remove('selected'));return;}$('#workspace').style.display='block';const o=orgs[org],d=state[org];$('#workspace-title').textContent=o.name+(o.subtitle?' '+o.subtitle:'');$('#workspace-number').textContent='WORKSPACE '+o.num;document.querySelectorAll('[data-org]').forEach(b=>{b.classList.toggle('selected',b.dataset.org===org);b.setAttribute('aria-pressed',String(b.dataset.org===org))});document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false')});
if(tab==='overview'){const open=d.tasks.filter(t=>!t.done).length;content.innerHTML=''+(org==='bridge'?'<div style="border:1px solid #555;border-radius:14px;padding:18px;margin-bottom:20px;background:#222326"><div class="eyebrow">MEMBER WORKSPACE DEMO</div><h3 style="margin:9px 0;font-size:20px">To Do · Committees · Notifications</h3><p class="muted" style="font-size:13px">Explore board, committee member and client admin experiences.</p><a href="./client-demo.html?v=20261105-4" style="display:inline-block;background:white;color:#111;text-decoration:none;border-radius:9px;padding:12px 16px;font-weight:700;font-size:13px">Open interactive workspace →</a></div>':'')+'<div class="stats"><div class="stat"><small>OPEN TASKS</small><b>'+open+'</b></div><div class="stat"><small>SAVED NOTES</small><b>'+d.notes.length+'</b></div><div class="stat"><small>CONNECTED SERVICES</small><b>0 / 5</b></div></div><div class="eyebrow" style="margin-bottom:14px">SERVICE DIRECTORY</div><div class="services">'+services.map(s=>'<div class="service"><strong>'+escape(s)+'</strong><small>Not connected</small></div>').join('')+'</div>'}
else if(tab==='tasks'&&org==='bridge'){content.innerHTML='<div class="notice">The new combined To Do and Committee workspace is available in the interactive client preview.</div><a href="./client-demo.html?v=20261105-4" style="display:inline-block;background:white;color:#111;text-decoration:none;border-radius:9px;padding:12px 16px;font-weight:700">Open To Do workspace →</a>'}
else if(tab==='tasks'){content.innerHTML='<iframe title="Board tasks" src="./board-tasks.html?embedded=1" style="width:100%;height:850px;border:0;border-radius:12px;background:#0c0d0f" loading="lazy"></iframe><p class="muted" style="font-size:12px">Prototype: tasks are stored on this device only, not shared with board members.</p>'}
else if(tab==='notes'){content.innerHTML='<div class="eyebrow">WORKSPACE NOTES</div><form id="noteform"><textarea name="note" rows="4" maxlength="5000" required placeholder="Write a note for '+escape(o.name)+'…" aria-label="New note"></textarea><div style="margin-top:10px"><button type="submit">Save note +</button></div></form><div style="margin-top:22px">'+(d.notes.length?d.notes.map(n=>'<div class="note"><div class="row"><small>'+escape(n.date)+'</small><button data-delete-note="'+escape(n.id)+'">Delete</button></div><div style="margin-top:12px">'+escape(n.text)+'</div></div>').join(''):'<div class="empty">No notes yet.</div>')+'</div>';$('#noteform').onsubmit=e=>{e.preventDefault();const v=e.target.note.value.trim();if(!v)return;d.notes.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),text:v,date:new Date().toLocaleDateString()});save();render()};content.querySelectorAll('[data-delete-note]').forEach(el=>el.onclick=()=>{d.notes=d.notes.filter(n=>n.id!==el.dataset.deleteNote);save();render()})}
else{const s=d.settings;content.innerHTML='<div class="eyebrow">WORKSPACE SETTINGS</div><p class="muted"></p><form id="settingsform"><label>Public website URL<input type="url" name="website" placeholder="https://example.org" value="'+escape(s.website||'')+'"></label><div style="height:16px"></div><label>Public social handle<input name="handle" maxlength="100" placeholder="@organization" value="'+escape(s.handle||'')+'"></label><div style="margin-top:18px"><button type="submit">Save settings</button></div></form>';$('#settingsform').onsubmit=e=>{e.preventDefault();d.settings={website:e.target.website.value.trim(),handle:e.target.handle.value.trim()};save();alert('Saved in this browser.')}}
}
document.querySelectorAll('[data-org]').forEach(b=>b.onclick=()=>{if(b.dataset.org==='bridge'){window.location.href='./bridge-kids.html?v=20261105-10';return;}org=b.dataset.org;tab='overview';render();$('#workspace').scrollIntoView({behavior:'smooth',block:'start'})});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});render();
})();
</script></body></html>
