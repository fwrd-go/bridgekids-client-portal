<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Email | FWRD</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f7f5;color:#171717;font:15px Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit;color:inherit}button,a,input,select,textarea{outline-offset:4px}a{color:inherit}button{cursor:pointer;background:white;border:1px solid #ccc;border-radius:8px;padding:11px 14px}button.active,.primary{background:#171717;color:white;border-color:#171717}.wrap{max-width:1320px;margin:auto;padding:24px}header,.row{display:flex;justify-content:space-between;align-items:center;gap:16px}header{border-bottom:1px solid #ddd;padding-bottom:22px}.brand{font-weight:900;font-size:27px;letter-spacing:-1.5px}.label{font-size:11px;letter-spacing:1.5px;font-weight:700;color:#666}h1{font-size:42px;letter-spacing:-1.8px;margin:5px 0}h2{font-size:21px;margin:0 0 16px}p{line-height:1.6}.muted,small{color:#666}.head{margin:28px 0}.status{font-size:12px;border:1px solid #ccc;padding:8px 12px;border-radius:30px}.layout{display:grid;grid-template-columns:220px 340px 1fr;border:1px solid #ddd;border-radius:14px;background:white;min-height:530px;overflow:hidden}.sidebar,.list,.reader{padding:22px}.sidebar,.list{border-right:1px solid #ddd}.sidebar button{display:block;width:100%;text-align:left;margin:6px 0}.sidebar .label{margin:26px 0 10px}.list input{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px}.empty{padding:55px 4px;color:#666}.empty strong{display:block;color:#171717;font-size:21px;margin-bottom:12px}.reader{display:flex;flex-direction:column;justify-content:center}.reader .empty{max-width:370px;margin:auto}.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}.panel{border:1px solid #ddd;border-radius:14px;background:white;padding:24px;margin-bottom:16px}.directory{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.alias{border:1px solid #ddd;padding:20px;border-radius:10px}.alias strong{display:block;margin:8px 0}.field{display:block;margin:16px 0 6px;font-weight:600;font-size:13px}select,input,textarea{padding:12px;border:1px solid #bbb;background:white;border-radius:8px;width:100%}textarea{min-height:180px;resize:vertical}.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}.draft{display:block;text-align:left;width:100%;margin-top:12px}.note{font-size:12px;color:#666;margin:18px 0}.flow{display:grid;grid-template-columns:1fr 1fr;gap:20px}.hidden{display:none}#feedback{min-height:20px;font-size:13px}@media(max-width:1050px){.layout{grid-template-columns:190px 1fr}.reader{grid-column:1/-1;min-height:230px;border-top:1px solid #ddd}.list{border-right:0}}@media(max-width:600px){.wrap{padding:18px 12px}.layout{grid-template-columns:1fr}.sidebar{border-right:0;border-bottom:1px solid #ddd}.sidebar button{display:inline-block;width:auto}.sidebar .label{margin-top:16px}.list{padding:18px}.reader{min-height:210px}.directory,.flow{grid-template-columns:1fr}.head{align-items:flex-start}h1{font-size:34px}.status{font-size:11px}.panel{padding:18px}header a{font-size:12px}}</style>
<main class="wrap"><header><div class="brand">FWRD →</div><a href="./bridge-kids.html">← Bridge Kids workspace</a></header><div class="row head"><div><div class="label">BRIDGE KIDS / OUR PLACE</div><h1>Email</h1><div class="muted">One inbox. Four addresses.</div></div><span class="status">Not connected</span></div><nav class="tabs" aria-label="Email sections"><button data-view="inbox" class="active">Inbox</button><button data-view="addresses">Addresses</button><button data-view="connection">Connection</button></nav><div id="view"></div><p id="feedback" role="status"></p><p class="note">Layout preview · Live email is not connected. Drafts stay in this browser. No messages are sent.</p></main>
<script>
if(new URLSearchParams(location.search).get("org")==="ourplace"){const back=document.querySelector("header a");back.href="./our-place.html";back.textContent="← Our Place workspace";}

'use strict';
const aliases=[{id:'opbwp',label:'OPBWP',name:'Our Place'},{id:'business',label:'Business',name:'Business'},{id:'kizazi',label:'Kizazi Fund',name:'Kizazi Fund'},{id:'groups',label:'BK Groups',name:'BK Groups'}];
const mailConfig={provider:'google-workspace',mailboxId:null,connected:false,aliases:aliases.map(a=>({...a,address:null,sendAsVerified:false}))};
// Replace this adapter with an authenticated server API when connecting.
// Alias filters share one mailbox; they are never treated as separate accounts.
const mailAdapter={async listMessages({aliasId,folder,query}){return {messages:[],cursor:null,connected:false}},async getMessage(id){throw new Error('Email is not connected')},async send(){throw new Error('Email is not connected')}};
window.FWRDMail={config:mailConfig,adapter:mailAdapter};
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let view='inbox',folder='Inbox',alias='all',draftId=null,drafts=[];
try{const saved=JSON.parse(localStorage.getItem('fwrd-email-drafts-v1')||'[]');if(Array.isArray(saved))drafts=saved.filter(d=>d&&typeof d.id==='string'&&typeof d.subject==='string')}catch{}
function feedback(s){$('#feedback').textContent=s}
function persist(){try{localStorage.setItem('fwrd-email-drafts-v1',JSON.stringify(drafts));return true}catch{feedback('Draft could not be saved in this browser.');return false}}
function render(){document.querySelectorAll('[data-view]').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-pressed',String(b.dataset.view===view))});feedback('');
if(view==='addresses'){$('#view').innerHTML='<section class="panel"><div class="label">CONFIRMED ALIAS STRUCTURE</div><h2 style="margin-top:10px">Four addresses → one primary inbox</h2><p class="muted">Each address gets its own view while messages remain together in the shared mailbox.</p><div class="directory">'+aliases.map(a=>'<div class="alias"><div class="label">ALIAS</div><strong>'+esc(a.label)+'</strong><small>'+esc(a.name)+' · Primary inbox</small></div>').join('')+'</div></section>';return}
if(view==='connection'){$('#view').innerHTML='<section class="panel"><div class="label">GOOGLE WORKSPACE</div><h2 style="margin-top:10px">Connection structure</h2><div class="flow"><div><strong>Primary inbox</strong><p class="muted">One mailbox receives the four confirmed aliases.</p><strong>Address filters</strong><p class="muted">OPBWP · Business · Kizazi Fund · BK Groups</p></div><div><strong>Incoming mail</strong><p class="muted">Message list, search and reader are ready for an authenticated connection.</p><strong>Sending identity</strong><p class="muted">Each alias needs a verified send-as identity before sending is enabled.</p></div></div><a href="./email-admin.html">Email administration →</a></section>';return}
if(view==='compose'){compose();return}
$('#view').innerHTML='<section class="layout"><aside class="sidebar"><button class="primary" id="compose">+ Compose</button><div class="label">MAILBOX</div>'+['Inbox','Drafts','Sent','Archive'].map(f=>'<button data-folder="'+f+'" class="'+(folder===f?'active':'')+'">'+f+(f==='Drafts'?' ('+drafts.length+')':'')+'</button>').join('')+'<div class="label">ADDRESSES</div><button data-alias="all" class="'+(alias==='all'?'active':'')+'">All addresses</button>'+aliases.map(a=>'<button data-alias="'+a.id+'" class="'+(alias===a.id?'active':'')+'">'+esc(a.label)+'</button>').join('')+'</aside><section class="list"><h2>'+esc(folder)+'</h2><label class="label" for="search">SEARCH '+esc(alias==='all'?'ALL ADDRESSES':aliases.find(a=>a.id===alias).label)+'</label><input id="search" placeholder="Search email" type="search"><div id="messages"></div></section><section class="reader"><div class="empty"><div class="label">MESSAGE READER</div><strong>Select a message</strong><p>Messages will open here once the inbox is connected.</p></div></section></section>';
$('#compose').onclick=()=>{draftId=null;view='compose';render()};document.querySelectorAll('[data-folder]').forEach(b=>b.onclick=()=>{folder=b.dataset.folder;render()});document.querySelectorAll('[data-alias]').forEach(b=>b.onclick=()=>{alias=b.dataset.alias;render()});$('#search').oninput=messages;messages()}
function messages(){const q=$('#search').value.toLowerCase();const filtered=drafts.filter(d=>(alias==='all'||d.aliasId===alias)&&[d.subject,d.to,d.body].join(' ').toLowerCase().includes(q));$('#messages').innerHTML=folder==='Drafts'?(filtered.length?filtered.map(d=>'<button class="draft" data-draft="'+esc(d.id)+'"><strong>'+esc(d.subject||'Untitled draft')+'</strong><p class="muted">'+esc(d.to||'No recipient')+'</p></button>').join(''):'<div class="empty">No drafts in this view.</div>'):'<div class="empty"><strong>Ready for your email</strong><p>'+(q?'Search will be available when connected.':'Your '+esc(folder.toLowerCase())+' will appear here after connection.')+'</p></div>';document.querySelectorAll('[data-draft]').forEach(b=>b.onclick=()=>{draftId=b.dataset.draft;view='compose';render()})}
function compose(){const d=drafts.find(d=>d.id===draftId)||{aliasId:alias==='all'?'opbwp':alias};$('#view').innerHTML='<section class="panel"><h2>'+ (draftId?'Edit draft':'New message')+'</h2><form id="draftform"><label class="field" for="from">From address</label><select id="from">'+aliases.map(a=>'<option value="'+a.id+'" '+(a.id===d.aliasId?'selected':'')+'>'+esc(a.label)+' · alias</option>').join('')+'</select><label class="field" for="to">To</label><input id="to" type="email" value="'+esc(d.to||'')+'"><label class="field" for="subject">Subject</label><input id="subject" value="'+esc(d.subject||'')+'"><label class="field" for="body">Message</label><textarea id="body">'+esc(d.body||'')+'</textarea><div class="actions"><button class="primary" type="submit">Save local draft</button><button type="button" id="cancel">Back to inbox</button><button type="button" disabled title="Requires a connected inbox and verified sending identity">Send · Not connected</button></div></form></section>';
$('#cancel').onclick=()=>{view='inbox';render()};$('#draftform').onsubmit=e=>{e.preventDefault();const d={id:draftId||crypto.randomUUID(),aliasId:$('#from').value,to:$('#to').value.trim(),subject:$('#subject').value,body:$('#body').value,updatedAt:new Date().toISOString()};const i=drafts.findIndex(x=>x.id===d.id);if(i<0)drafts.unshift(d);else drafts[i]=d;if(persist()){draftId=d.id;view='inbox';folder='Drafts';alias='all';render();feedback('Draft saved in this browser.')}}}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});render();
</script></html>
